server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;

    # Max upload size (match the 20MB limit in the app)
    client_max_body_size 25M;

    # Proxy all traffic to the Node.js app
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}

# After running: sudo certbot --nginx -d yourdomain.com -d www.yourdomain.com
# Certbot will add the HTTPS server block and redirect automatically.
